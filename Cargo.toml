[package]
name = "grabbit"
version = "0.2.3"
edition = "2021"
rust-version = "1.85"
description = "Universal downloader: video and music from YouTube and Spotify, plus a download manager for any file"
license = "GPL-3.0-or-later"
# IMPORTANTE: metti qui l'URL del tuo repository GitHub. L'aggiornamento
# automatico dell'app legge le release da questo repository.
repository = "https://github.com/OWNER/grabbit"
build = "build.rs"

[features]
default = ["torrent"]
# BitTorrent (libtorrent, BSD-3-Clause) compilato e collegato staticamente.
# Senza cmake/Boost si può disattivare con --no-default-features.
torrent = ["dep:cmake", "dep:openssl-src"]

[dependencies]
# GUI leggera: renderer "glow" (OpenGL) al posto del più pesante wgpu
eframe = { version = "0.37", default-features = false, features = [
    "glow", "default_fonts", "clipboard", "wayland", "x11", "accesskit",
] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

# rete, dati, errori
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "6"
semver = "1"
self-replace = "1"
# estrazione di ffmpeg e Deno (zip) e di ffmpeg su Linux (tar.xz)
zip = { version = "9", default-features = false, features = ["deflate"] }
sys-locale = "0.3.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }

[build-dependencies]
cmake = { version = "0.1", optional = true }
openssl-src = { version = "300", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.21"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
