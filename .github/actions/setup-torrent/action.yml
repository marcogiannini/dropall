name: Setup torrent build dependencies
description: >
  Downloads the Boost headers (header-only use, needed to compile libtorrent) and
  exports DROPALL_BOOST_ROOT. CMake and Perl (for OpenSSL) are already on the runners.
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/boost
        key: boost-headers-1.86.0-v1
    - name: Download Boost headers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # cd + relative paths: GNU tar on Windows reads "D:\..." as a remote host
        mkdir -p "$RUNNER_TEMP/boost-dl" "$RUNNER_TEMP/boost"
        cd "$RUNNER_TEMP/boost-dl"
        curl -fsSL --retry 5 -o boost.tar.gz \
          https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.gz
        cd "$RUNNER_TEMP/boost"
        tar -xzf ../boost-dl/boost.tar.gz --strip-components=1 boost_1_86_0/boost
        # the headers live in <root>/boost
    - name: Export DROPALL_BOOST_ROOT
      shell: bash
      run: |
        root="$(cd "$RUNNER_TEMP/boost" && pwd)"
        # CMake on Windows needs a Windows-style path (D:/a/_temp/boost), not /d/a/...
        test -f "$root/boost/version.hpp" || { echo "Boost headers missing in $root"; ls -la "$root"; exit 1; }
        if command -v cygpath >/dev/null 2>&1; then root="$(cygpath -m "$root")"; fi
        echo "DROPALL_BOOST_ROOT=$root" >> "$GITHUB_ENV"
